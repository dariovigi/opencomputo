[workspace]
resolver = "3"
members = ["crates/opencomputo-core", "crates/opencomputo-format-xpwe", "crates/opencomputo-dcf-parser", "crates/opencomputo-io", "crates/opencomputo-storage", "crates/opencomputo-application", "crates/opencomputo-agent-api", "crates/opencomputo-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "EUPL-1.2"

[workspace.dependencies]
rust_decimal = { version = "1.36", default-features = false, features = ["std", "serde", "maths"] }
rust_decimal_macros = "1.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", default-features = false, features = ["std", "serde"] }
chrono = { version = "0.4.38", default-features = false, features = ["std", "serde"] }
quick-xml = "0.41"
encoding_rs = "0.8"
sha2 = "0.11"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
rust_xlsxwriter = { version = "0.100", default-features = false }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Garanzia strutturale: nessuna aritmetica in virgola mobile nel codice contabile.
float_arithmetic = "deny"
float_cmp = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
