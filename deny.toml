# Verifica della catena di fornitura: `cargo deny check`.
# Licenze ammesse, vulnerabilità note (RustSec), crate di sorgenti non ufficiali.

[graph]
all-features = true

[advisories]
# Vulnerabilità e crate non più mantenuti dal database RustSec.
version = 2
yanked = "deny"
# Crate non più mantenuti senza vulnerabilità note, usati solo dentro Tauri e GTK e
# senza alternative finché non li sostituiscono i progetti a monte. Da rivedere a ogni
# aggiornamento di Tauri. Nessuna eccezione per vulnerabilità.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: macro di compilazione di glib/gtk-rs 0.18 (Linux), non eseguito a runtime" },
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range: usato da urlpattern in tauri-utils" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common: usato da urlpattern in tauri-utils" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property: usato da urlpattern in tauri-utils" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version: usato da urlpattern in tauri-utils" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident: usato da urlpattern in tauri-utils" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  # Permissiva (equivalente a MIT/BSD-2), compatibile con la EUPL-1.2: ring e rustls-webpki,
  # la crittografia TLS dell'assistente AI (ADR 0025).
  "ISC",
  # Copyleft debole a livello di file, compatibile con la EUPL-1.2 (crate CSS della webview).
  "MPL-2.0",
  # Licenza del progetto.
  "EUPL-1.2",
]

# Certificati radice di Mozilla (licenza dei dati, permissiva): rustls-platform-verifier li
# usa solo compilando per wasm32, che per opencomputo-rete non avviene.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
