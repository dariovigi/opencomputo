# Verifiche a ogni push e pull request: formattazione, clippy, test Rust su tre sistemi,
# catena di fornitura (cargo deny), test end-to-end dell'interfaccia.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LINUX_GUI_DEPS: libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libayatana-appindicator3-dev

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Librerie di sistema per la GUI (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_GUI_DEPS
      - uses: Swatinem/rust-cache@v2
      - name: Formattazione
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace

  msrv:
    name: Versione minima di Rust (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_GUI_DEPS
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked

  deny:
    name: Catena di fornitura (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  interfaccia:
    name: Test end-to-end dell'interfaccia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p opencomputo-agent-api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test in Chromium con il motore reale
        working-directory: crates/opencomputo-gui/ui-tests
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
          npm test
