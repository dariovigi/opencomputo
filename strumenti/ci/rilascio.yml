# Pacchetti installabili per macOS, Windows e Linux a ogni tag `v*`, allegati a una
# release in bozza. I pacchetti non sono firmati: firma e notarizzazione richiedono
# certificati del titolare (vedi docs/RILASCIO.md).
name: Rilascio

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pacchetti:
    name: Pacchetti (${{ matrix.piattaforma }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - piattaforma: macos-latest
            argomenti: --target universal-apple-darwin
          - piattaforma: windows-latest
            argomenti: ''
          - piattaforma: ubuntu-22.04
            argomenti: ''
    runs-on: ${{ matrix.piattaforma }}
    steps:
      - uses: actions/checkout@v4
      # Compilatore fissato alla versione con cui il progetto è verificato: una versione
      # più nuova può aggiungere controlli che fanno fallire `-D warnings`. Si aggiorna
      # qui dopo aver provato in locale.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.piattaforma == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Librerie di sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libayatana-appindicator3-dev patchelf
      - uses: Swatinem/rust-cache@v2
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/opencomputo-gui
          # Avviato a mano (senza tag) costruisce soltanto: i file si scaricano dalla
          # pagina dell'esecuzione, senza creare una release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          # Nome e tag vanno dati insieme o per niente: l'azione rifiuta l'uno senza l'altro.
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('OpenComputo {0}', github.ref_name) || '' }}
          releaseBody: Pacchetti non firmati. Vedi CHANGELOG.md e docs/GUIDA.md.
          releaseDraft: true
          args: ${{ matrix.argomenti }}
      # Windows: anche l'eseguibile da solo, senza installazione («portatile»). Non chiede
      # privilegi di amministratore; usa il WebView2 già presente in Windows 10 e 11.
      - name: Eseguibile portatile (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp target/release/opencomputo-gui.exe OpenComputo-portatile-x64.exe
      # Pacchetti di ogni sistema tra i file dell'esecuzione: avviato a mano non c'è una
      # release, e questo è l'unico posto da cui scaricarli. `error` rende rosso il job se
      # un pacchetto manca, invece di finire verde a mani vuote.
      - name: Pacchetti Windows tra i file dell'esecuzione
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: OpenComputo-windows-x64
          if-no-files-found: error
          path: |
            OpenComputo-portatile-x64.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
      - name: Pacchetti macOS tra i file dell'esecuzione
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: OpenComputo-macos-universale
          if-no-files-found: error
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - name: Pacchetti Linux tra i file dell'esecuzione
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: OpenComputo-linux-x64
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
      - name: Eseguibile portatile nella release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" OpenComputo-portatile-x64.exe --clobber
