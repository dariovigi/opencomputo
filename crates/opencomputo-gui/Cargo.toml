[package]
name = "opencomputo-gui"
description = "Applicazione desktop di OpenComputo (Tauri v2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "opencomputo_gui"
path = "src/lib.rs"

[[bin]]
name = "opencomputo-gui"
path = "src/main.rs"

[features]
# Risorse dell'interfaccia incorporate nel binario: `cargo run` funziona senza la CLI di Tauri.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6", default-features = false , features = [] }

[dependencies]
opencomputo-agent-api = { path = "../opencomputo-agent-api" }
tauri = { version = "2.11", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
tauri-plugin-dialog = "2.7"
serde_json.workspace = true

[lints]
workspace = true
