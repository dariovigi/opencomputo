[package]
name = "opencomputo-agent-api"
description = "Interfaccia a riga di comando e protocollo JSON di OpenComputo per persone e agenti AI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "opencomputo"
path = "src/main.rs"

[dependencies]
opencomputo-application = { path = "../opencomputo-application" }
opencomputo-core = { path = "../opencomputo-core" }
opencomputo-storage = { path = "../opencomputo-storage" }
opencomputo-io = { path = "../opencomputo-io" }
opencomputo-assistente = { path = "../opencomputo-assistente" }
opencomputo-rete = { path = "../opencomputo-rete" }
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
clap.workspace = true

[features]
# Solo per lo sviluppo: chiavi anche da OPENAI_API_KEY e ANTHROPIC_API_KEY.
chiavi-da-ambiente = ["opencomputo-rete/chiavi-da-ambiente"]
# Solo per i test dell'interfaccia: con OPENCOMPUTO_PROVIDER_DI_PROVA=http://127.0.0.1:…
# le chiamate ai provider vanno a un server locale finto e le chiavi restano in memoria.
banco-di-prova = []

[dev-dependencies]
flate2.workspace = true

[lints]
workspace = true
