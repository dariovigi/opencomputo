[package]
name = "opencomputo-core"
description = "Modello di dominio, validazioni e calcoli puri di OpenComputo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
# Generazione di identificativi casuali (UUID v4). Disattivata di default per
# mantenere il core deterministico e privo di dipendenze dalla piattaforma.
id-casuali = ["uuid/v4"]

[dependencies]
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
jiff.workspace = true

[dev-dependencies]
rust_decimal_macros.workspace = true

[lints]
workspace = true
