[package]
name = "opencomputo-rete"
description = "Trasporto HTTPS e portachiavi di sistema per l'assistente AI di OpenComputo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Solo per lo sviluppo: legge OPENAI_API_KEY e ANTHROPIC_API_KEY se il portachiavi non ha
# la chiave. Da non attivare nei pacchetti distribuiti.
chiavi-da-ambiente = []

[dependencies]
opencomputo-assistente = { path = "../opencomputo-assistente" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
keyring-core = "1.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
